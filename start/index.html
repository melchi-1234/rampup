<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Start your RampUp — see your levels in two minutes</title>
<meta name="description" content="Answer a few questions about your coursework and see a real starting level for every MCAT subject, plus your first day's plan. No account, no card." />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://rampupmcat.com/start/" />
<meta name="theme-color" content="#7c3aed" />
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css" />
<style>
  body{background:var(--wash)}
  .shell{max-width:640px; margin:0 auto; padding:0 18px 96px}
  .topbar{
    position:sticky; top:0; z-index:20; background:rgba(248,246,253,.96);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    margin:0 calc(50% - 50vw) 8px; padding:14px calc(50vw - 50%) 12px;
    border-bottom:1px solid var(--line);
  }
  .topbar-in{display:flex; align-items:center; gap:14px}
  .backbtn{
    border:0; background:transparent; font:inherit; font-size:15px; font-weight:680;
    color:var(--muted); cursor:pointer; padding:10px 8px; min-height:44px; margin-left:-8px;
  }
  .backbtn:hover{color:var(--ink)}
  .prog{flex:1; height:7px; background:var(--line); border-radius:99px; overflow:hidden}
  .prog i{
    display:block; width:0; height:100%; background:linear-gradient(90deg,var(--lav),var(--violet));
    transition:width .55s cubic-bezier(.22,1,.36,1); position:relative; overflow:hidden; transform-origin:left center;
  }
  .prog i::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    transform:translateX(-100%); animation:progShine 2.2s ease-in-out infinite;
  }
  @keyframes progShine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
  @keyframes progPulse{0%{transform:scaleY(1)}35%{transform:scaleY(1.7)}100%{transform:scaleY(1)}}
  .prog.pulse i{animation:progPulse .45s cubic-bezier(.34,1.56,.64,1)}
  @keyframes lineIn{from{opacity:0; transform:translateX(-10px)}to{opacity:1; transform:none}}
  @keyframes checkPop{from{transform:scale(0)}to{transform:scale(1)}}
  .bstep-line{animation:lineIn .32s cubic-bezier(.22,1,.36,1) both}
  .bstep-check{display:inline-block; animation:checkPop .3s .06s cubic-bezier(.34,1.56,.64,1) both}
  .stepno{font-size:13px; font-weight:740; color:var(--faint); white-space:nowrap}

  .panel{background:#fff; border:1px solid var(--line); border-radius:var(--r-xl); padding:26px 22px; box-shadow:var(--shadow)}
  @media(max-width:520px){ .panel{padding:22px 17px} }
  .panel h1{font-size:clamp(23px,5.2vw,30px); margin-bottom:8px}
  .panel .sub{color:var(--muted); font-size:16px; margin:0 0 22px; line-height:1.55}

  .opts{display:grid; gap:10px}
  .opt{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:1.6px solid var(--line); background:#fff; border-radius:var(--r);
    padding:15px 17px; font:inherit; font-size:16.5px; font-weight:640; cursor:pointer;
    min-height:56px; transition:border-color .14s, background .14s;
  }
  .opt:hover{border-color:var(--lav)}
  .opt[aria-pressed="true"]{border-color:var(--violet); background:var(--violet-soft); font-weight:740}
  .opt .tick{
    margin-left:auto; color:var(--violet); font-weight:900; opacity:0; font-size:18px;
    transform:scale(.4); transition:opacity .16s ease, transform .24s cubic-bezier(.34,1.56,.64,1);
  }
  .opt[aria-pressed="true"] .tick{opacity:1; transform:scale(1)}
  /* Press feedback: tap acknowledgment on touch, where :hover never fires. */
  .opt,.seg button,.planopt,.sampleq .sq-choice{
    transition:border-color .14s, background .14s, transform .1s cubic-bezier(.2,0,0,1);
  }
  .opt:active,.seg button:active,.planopt:active,.sampleq .sq-choice:active{transform:scale(.965)}

  /* Plan rows: label | price | badge. Nothing wraps at 320px. */
  .planopt{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; padding:15px 17px}
  .planopt .pl-label{font-weight:760; font-size:17px; white-space:nowrap}
  .planopt .pl-per{font-size:13.5px; color:var(--faint); font-weight:600; grid-column:1; margin-top:-2px}
  .planopt .pl-price{font-weight:840; font-size:19px; grid-column:2; grid-row:1; white-space:nowrap}
  .planopt .pl-price i{font-style:normal; font-size:13.5px; font-weight:700; color:var(--muted)}
  .planopt .pl-flag{
    display:inline-block; font-size:11px; font-weight:820; letter-spacing:.05em;
    text-transform:uppercase; color:#0b7a56; background:#e4f7ee;
    padding:3px 8px; border-radius:99px; margin-left:7px; vertical-align:1px;
  }
  .reassure{text-align:center; font-size:14px; color:var(--muted); margin:14px 0 0}

  .courses{display:grid; gap:8px}
  .crow{border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; background:#fff}
  .crow .cname{font-weight:660; font-size:15.5px; margin-bottom:9px}
  .seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .seg button{
    border:1.4px solid var(--line); background:#fff; border-radius:10px; padding:10px 4px;
    font:inherit; font-size:13.5px; font-weight:660; cursor:pointer; min-height:44px; color:var(--muted);
  }
  .seg button[aria-pressed="true"]{background:var(--violet); border-color:var(--violet); color:#fff; font-weight:760}
  .grouphead{font-size:12.5px; font-weight:820; letter-spacing:.07em; text-transform:uppercase;
    color:var(--faint); margin:18px 0 8px}
  .grouphead:first-child{margin-top:0}

  .err{color:#c0322c; font-size:14.5px; font-weight:640; margin:8px 0 0; min-height:20px}
  .actions{margin-top:12px}
  .dateinput{
    width:100%; border:1.6px solid var(--line); border-radius:var(--r); padding:14px 16px;
    font:inherit; font-size:16.5px; min-height:56px; margin-top:10px; background:#fff; color:var(--ink);
  }

  /* reveal */
  .rev-hero{text-align:center; padding:4px 0 20px}
  .rev-hero .big{font-size:clamp(27px,5.6vw,34px); font-weight:850; letter-spacing:-.02em; line-height:1.2}
  .rev-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:18px 0 6px}
  .rev-stat{background:var(--wash); border-radius:var(--r); padding:13px 8px; text-align:center}
  .rev-stat .n{font-size:19px; font-weight:840; color:var(--violet-strong)}
  .rev-stat .l{font-size:12px; color:var(--muted); line-height:1.3; margin-top:2px}
  .catgroup{margin-top:20px}
  .catname{font-size:12.5px; font-weight:820; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin-bottom:6px}
  .planblock{display:flex; gap:13px; align-items:flex-start; padding:15px 0; border-top:1px solid var(--line)}
  .planblock:first-of-type{border-top:0}
  .pb-n{width:28px; height:28px; flex:none; border-radius:50%; display:grid; place-items:center;
    font-size:13.5px; font-weight:820; color:#fff}
  .pb-new{background:var(--violet)} .pb-practice{background:var(--teal)} .pb-review{background:var(--orange)}
  .pb-t{display:block; font-weight:720; font-size:16px} .pb-w{display:block; font-size:14.5px; color:var(--muted); margin-top:3px; line-height:1.55}

  .planlist{margin:0; padding:0; list-style:none}
  .sep{height:1px; background:var(--line); margin:24px 0}

  /* Per-step character. Acely uses a bespoke illustration on each onboarding
     screen; Rampy already has moods in the product, so the site uses those
     rather than stock art that belongs to nobody. */
  .step-art{display:flex; justify-content:center; margin:0 0 18px}
  .step-art svg{display:block}
  .rampy-img{width:96px; height:96px; object-fit:contain; animation:rampyFloat 3.4s ease-in-out infinite}
  @keyframes rampyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  /* The reveal's earned moment: Rampy's real 4-frame celebration bounce,
     generated on-model from the reference art. steps(4) walks the strip. */
  .rampy-sprite{
    width:96px; height:96px;
    background:url(/assets/rampy/celebrate-sprite.png) 0 0/400% 100% no-repeat;
    animation:rampyPlay 1.1s steps(4) infinite;
  }
  .rampy-sprite-think{
    background-image:url(/assets/rampy/think-sprite.png);
    animation-duration:2.2s;   /* thinking is calmer than celebrating */
  }
  .rampy-sprite-happy{
    background-image:url(/assets/rampy/happy-sprite.png);
    animation-duration:1.8s;
  }
  @keyframes rampyPlay{to{background-position:-384px 0}}
  @media(max-width:520px){ .step-art{margin-bottom:12px} .step-art svg,.rampy-img{width:74px;height:74px} }
  /* Step entrance: each panel rises in. Cheap, premium, and honest to reduced-motion. */
  .panel{animation:panelIn .34s cubic-bezier(.22,1,.36,1) both}
  @keyframes panelIn{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
  @media(prefers-reduced-motion:reduce){ .rampy-img,.panel,.rampy-sprite,.panel.dir-back{animation:none} }
  .arw{display:inline-block; transition:transform .18s ease}
  .btn:hover .arw{transform:translateX(3px)}
  .linkbtn{
    background:none; border:0; font:inherit; font-size:13px; color:var(--muted);
    text-decoration:underline; cursor:pointer; padding:8px; min-height:44px;
  }
  .linkbtn:hover{color:var(--ink)}
  .btn-primary:disabled{background:#ece7fb; color:#6d5bb8; opacity:1; cursor:default}

  /* The affirmation strip: the previous answer, converted into a plan
     consequence. This is the investment loop — every input visibly BUILDS
     something of theirs. */
  .affirm{display:flex; gap:10px; align-items:flex-start; background:var(--violet-soft);
    border:1px solid #ddd2f7; border-radius:var(--r); padding:12px 15px; margin:0 0 18px;
    font-size:14.5px; line-height:1.55; color:#3b3357}
  .affirm b{color:var(--violet-strong)}
  .affirm .a-ico{flex:none; font-weight:900; color:var(--violet)}

  /* Urgency block on the reveal: THEIR deadline, done as arithmetic. */
  .mathbox{background:var(--ink); color:#f4f2fb; border-radius:var(--r-lg); padding:18px 19px; margin:20px 0 4px}
  .mathbox .mrow{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:5px 0; font-size:15px}
  .mathbox .mrow b{font-size:17px; white-space:nowrap}
  .mathbox .mfoot{border-top:1px solid rgba(255,255,255,.18); margin-top:9px; padding-top:11px; font-size:14px; color:#cfc9e6; line-height:1.5}

  /* Guarantee card: risk reversal at the decision point. */
  .guarantee{border:1.6px solid var(--violet); border-radius:var(--r-lg); padding:17px 18px; margin:20px 0 0; background:#fff}
  .guarantee .g-head{display:flex; align-items:center; gap:9px; font-weight:800; font-size:16.5px; margin-bottom:6px}
  .guarantee .g-shield{flex:none; width:22px; height:22px; display:grid; place-items:center;
    background:var(--violet); color:#fff; border-radius:7px; font-size:12px; font-weight:900}
  .guarantee .g-body{font-size:14.5px; color:var(--muted); line-height:1.6}
  .guarantee .g-body a{color:var(--violet-strong); font-weight:700}

  .commit-opts .opt{min-height:62px; font-size:17px}
  .sampleq{border:1.6px solid var(--line); border-radius:var(--r-lg); padding:17px 18px; margin:20px 0 0; background:#fff}
  .sampleq .sq-eyebrow{font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--violet-strong); margin-bottom:8px}
  .sampleq .sq-stem{font-weight:700; font-size:15.5px; line-height:1.55; margin-bottom:12px}
  .sampleq .sq-choice{display:block; width:100%; text-align:left; font:inherit; font-size:14.5px; line-height:1.5;
    border:1.4px solid var(--line); background:#fff; border-radius:12px; padding:11px 14px; margin-bottom:8px; cursor:pointer; min-height:44px}
  .sampleq .sq-choice.right{border-color:#0d9f6e; background:#e9f8f1}
  .sampleq .sq-choice.wrongpick{border-color:#c0322c; background:#fdf0ef}
  .sampleq .sq-expl{font-size:14px; color:var(--muted); line-height:1.6; margin-top:10px; border-top:1px solid var(--line); padding-top:12px}
  .commit-note{font-size:14px; color:var(--faint); text-align:center; margin-top:14px; line-height:1.55}
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="topbar-in">
      <button class="backbtn" id="back" type="button">‹ Back</button>
      <div class="prog"><i id="bar"></i></div>
      <span class="stepno" id="stepno"></span>
    </div>
  </div>
  <main id="view" aria-live="polite"></main>
</div>

<script>
(function(){ try {
  fetch("/assets/reveal-samples.json").then(function(r){ return r.json(); })
    .then(function(j){ window.RU_SAMPLES = j; }).catch(function(){});
} catch(e){} })();
</script>
<script src="/assets/brand.js"></script>
<script src="/assets/funnel.js"></script>
<script src="/assets/billing.js"></script>
<script src="/assets/vendor/gsap/gsap.min.js" defer></script>
<script src="/assets/motion-funnel.js" defer></script>
<script>
(function () {
  "use strict";
  var S = RU.load();
  var view = document.getElementById("view");
  var bar = document.getElementById("bar");
  var stepno = document.getElementById("stepno");
  var backBtn = document.getElementById("back");

  var STEPS = ["name", "grade", "when", "target", "feeling", "courses", "reveal", "commit", "plan"];
  var LABEL = { name: "Hello", grade: "About you", when: "Test timing", target: "Target score", feeling: "Where you are",
                courses: "Coursework", reveal: "Your levels", commit: "One question", plan: "Your plan" };
  // One Rampy mood per step — our equivalent of a per-step illustration, and
  // it is the character already in the product rather than stock art.
  var MOOD = { name: "happy", grade: "happy", when: "grad", target: "think", feeling: "happy",
               courses: "think", reveal: "celebrate", commit: "think", plan: "grad" };

  /* The previous answer, converted into a consequence for THEIR plan. This is
     deliberate psychology (investment: each input visibly builds their plan),
     built only from true inputs — their words in, plan mechanics out. */
  function affirmFor(step) {
    var n = RU.firstName();
    if (step === "target") {
      var dt = RU.daysUntilTest();
      if (dt !== null && dt > 0)
        return "<b>" + dt + " days out.</b> " + (dt >= 150
          ? "That is real runway - your plan gets to teach subjects before it ever tests them."
          : dt >= 90 ? "Enough runway for a full ramp, if it starts now."
          : "A focused window. Your plan will spend it converting knowledge into points, not re-teaching.");
      return "";
    }
    if (step === "feeling") {
      if (S.targetSet)
        return "<b>A " + (S.target === null ? "511" : S.target) + " plan.</b> Every daily session from here is paced against that number.";
      var d = RU.daysUntilTest();
      if (d !== null && d > 0)
        return "<b>" + d + " days out.</b> " + (d >= 150
          ? "That is real runway - your plan gets to teach subjects before it ever tests them."
          : d >= 90 ? "Enough runway for a full ramp, if it starts now."
          : "A focused window. Your plan will spend it converting knowledge into points, not re-teaching.");
      var g = S.grade || "";
      if (g === "High school" || g === "College freshman" || g === "College sophomore")
        return "<b>Early is an edge.</b> Most people cram the last 90 days. Your plan gets to teach subjects before it ever tests them.";
      return "<b>Noted.</b> Your daily target starts realistic for your schedule, and adapts from your first session.";
    }
    if (step === "courses") {
      var f = S.feeling;
      if (f === "behind")  return "<b>Then this next screen matters most.</b> Mark honestly what you have not taken — those subjects get taught from zero, before any question assumes them.";
      if (f === "unsure")  return "<b>Let's find out where you stand.</b> Two screens from now you will know your real starting level in all eight subjects.";
      if (f === "steady")  return "<b>Then let's build it exactly to your coursework.</b> Mark what you have taken and the levels set themselves.";
      return "<b>Confident is testable.</b> Mark your coursework and RampUp will start you high — and push higher the moment you clear a tier.";
    }
    if (step === "confidence") {
      var touched = RU.touchedSubjects().length, previews = 7 - touched;
      if (previews > 0)
        return "<b>" + touched + " subject" + (touched === 1 ? "" : "s") + " with coursework, " + previews + " starting in Preview.</b> The Preview ones get the concept lesson first — they are scheduled, not skipped.";
      return "<b>Coursework in all seven.</b> Now the honest part: confidence decides your starting tier, and starting too high is the classic self-sabotage.";
    }
    if (step === "when") {
      // Courses haven't been asked yet at this step — only name and grade are
      // known, so the affirm may only use those (never assert unknown levels).
      var gw = S.grade || "";
      if (gw === "High school" || gw === "College freshman" || gw === "College sophomore")
        return "<b>Early is an edge.</b> The sooner your date, the more of your plan gets spent teaching before it ever tests you.";
      return "<b>One more thing before your levels.</b> Your test date sets how hard the plan pushes review.";
    }
    return "";
  }
  function affirmStrip(step) {
    var a = affirmFor(step);
    return a ? '<div class="affirm"><span class="a-ico">&check;</span><span>' + a + '</span></div>' : "";
  }

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  };

  function current() {
    var h = (location.hash || "").replace("#", "");
    return STEPS.indexOf(h) !== -1 ? h : "name";
  }
  function go(step, replace) {
    if (replace) location.replace("#" + step); else location.hash = step;
  }

  function nextOf(step) { return STEPS[STEPS.indexOf(step) + 1]; }
  function prevOf(step) { return STEPS[STEPS.indexOf(step) - 1]; }

  var _seenSteps = {};
  function chrome(step) {
    var idx = STEPS.indexOf(step);
    /* Endowed progress: the meter starts 12% full (goal-gradient) and measures
       the PLAN being built, not pages seen. */
    bar.style.width = Math.round(12 + idx / (STEPS.length - 1) * 88) + "%";
    bar.parentElement.classList.remove("pulse");
    void bar.parentElement.offsetWidth;   // restart the pulse animation
    bar.parentElement.classList.add("pulse");
    stepno.textContent = LABEL[step] || "";
    backBtn.style.visibility = step === "name" ? "hidden" : "visible";
    RU.stepMark(step);
    RU.track("step_view", { step: step, step_index: idx, repeat: !!_seenSteps[step] });
    _seenSteps[step] = true;
  }

  /* ------------------------------------------------------------------ steps */

  function stepArt(step) {
    var mood = MOOD[step] || "happy";
    if (mood === "sad" || mood === "sleep") mood = "think";
    if (mood === "celebrate")
      return '<div class="step-art"><div class="rampy-sprite" role="img" aria-label=""></div></div>';
    if (mood === "think")
      return '<div class="step-art"><div class="rampy-sprite rampy-sprite-think" role="img" aria-label=""></div></div>';
    if (mood === "happy")
      return '<div class="step-art"><div class="rampy-sprite rampy-sprite-happy" role="img" aria-label=""></div></div>';
    return '<div class="step-art"><img class="rampy-img" src="/assets/rampy/' + mood +
           '.png" alt="" width="96" height="96" decoding="async" /></div>';
  }
  function repaintArt() { if (window.RUBrand) {
    view.querySelectorAll("[data-mark]").forEach(function (el) {
      el.innerHTML = RUBrand.rampy(Number(el.dataset.size) || 36, el.dataset.mark);
    });
  } }

  function renderName() {
    view.innerHTML =
      '<div class="panel">' + stepArt("name") +
      '<h1>First things first — what should we call you?</h1>' +
      '<p class="sub">Just a first name. It stays on this device and is never sent anywhere ' +
      '&mdash; there is no account to put it in.</p>' +
      '<input class="dateinput" id="nameIn" type="text" autocomplete="given-name" ' +
      'placeholder="Your first name" maxlength="40" value="' + esc(S.name) + '" />' +
      '<p class="err" id="err"></p>' +
      '<div class="actions"><button class="btn btn-primary btn-block" id="next" type="button">' +
      'Continue <span class="arw">&rarr;</span></button></div>' +
      '<p class="tiny" style="text-align:center;margin:12px 0 0">' +
      '<button class="linkbtn" id="skipName" type="button">Skip this</button></p></div>';
    repaintArt();
    var inp = document.getElementById("nameIn"), btn = document.getElementById("next");
    inp.addEventListener("input", function () { S.name = inp.value; RU.save(); });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") btn.click(); });
    btn.addEventListener("click", function () {
      S.name = inp.value.trim(); RU.save();
      RU.track(S.name ? "step_complete" : "name_skipped", { step: "name", step_index: 0 });
      go(nextOf("name"));
    });
    document.getElementById("skipName").addEventListener("click", function () {
      S.name = ""; RU.save(); RU.track("name_skipped", {}); go(nextOf("name"));
    });
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 90);
  }

  function renderGrade() {
    var n = RU.firstName();
    view.innerHTML =
      '<div class="panel">' + stepArt("grade") +
      '<h1>' + (n ? "Nice to meet you, " + esc(n) + ". Where are you right now?" : "Where are you right now?") + '</h1>' +
      '<p class="sub">This sets a realistic daily target. You can change it later.</p>' +
      '<div class="opts" id="opts"></div><p class="err" id="err"></p></div>';
    repaintArt();
    var box = document.getElementById("opts");
    RU.GRADES.forEach(function (g) {
      var b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.setAttribute("aria-pressed", String(S.grade === g));
      b.innerHTML = esc(g) + '<span class="tick">✓</span>';
      b.addEventListener("click", function () {
        if (b.getAttribute("aria-pressed") === "true") return;   // double-tap during the hold
        box.querySelectorAll(".opt").forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");

  function renderCourses() {
    /* Subject-level controls: 7 decisions instead of 11. The per-course fan-out
       is deterministic and produces byte-identical tiers, because both
       consumers (isPreview, startingDifficulty) only ever ask .some() over the
       subject's courses. Completed reveals an inline confidence segment, so
       the old separate confidence step is gone. */
    var h = '<div class="panel">' + stepArt("courses") + affirmStrip("courses") +
      '<h1>Which of these have you taken?</h1>' +
      '<p class="sub">Answer per subject. Anything you have not touched starts in Preview and gets taught before it is tested. AP credit with a 4 or 5 counts as Completed. If you marked it Completed, say how solid it feels &mdash; honest answers set the right starting level.</p>' +
      '<div class="courses">';
    RU.SUBJECTS.forEach(function (subj) {
      var states = subj.courses.map(function (c) { return S.courses[c] || "none"; });
      var subjState = states.indexOf("completed") !== -1 ? "completed"
                    : states.indexOf("taking") !== -1 ? "taking" : "none";
      h += '<div class="crow"><div class="cname">' + esc(subj.name) + '</div><div class="seg">';
      RU.COURSE_STATES.forEach(function (o) {
        h += '<button type="button" data-subj="' + esc(subj.name) + '" data-val="' + o.v +
             '" aria-pressed="' + (subjState === o.v) + '">' + esc(o.l) + '</button>';
      });
      h += '</div>';
      if (subjState === "completed") {
        h += '<div class="seg" style="margin-top:7px">';
        RU.CONF_STATES.forEach(function (o) {
          h += '<button type="button" data-conf="' + esc(subj.name) + '" data-val="' + o.v +
               '" aria-pressed="' + (S.confidence[subj.name] === o.v) + '">' + esc(o.l) + '</button>';
        });
        h += '</div>';
      }
      h += '</div>';
    });
    h += '</div><p class="err" id="err"></p>' +
         '<div class="actions"><button class="btn btn-primary btn-block" id="next" type="button">See my levels <span class="arw">&rarr;</span></button></div></div>';
    view.innerHTML = h;
    repaintArt();

    view.querySelectorAll("[data-subj]").forEach(function (b) {
      b.addEventListener("click", function () {
        var subj = RU.SUBJECTS.filter(function (x) { return x.name === b.dataset.subj; })[0];
        if (!subj) return;
        var v = b.dataset.val;
        var states = subj.courses.map(function (c) { return S.courses[c] || "none"; });
        var cur = states.indexOf("completed") !== -1 ? "completed"
                : states.indexOf("taking") !== -1 ? "taking" : "none";
        var next = (cur === v && v !== "none") ? "none" : v;
        subj.courses.forEach(function (c) { S.courses[c] = next; });
        if (next !== "completed") delete S.confidence[subj.name];
        RU.save(); renderCourses();
      });
    });
    view.querySelectorAll("[data-conf]").forEach(function (b) {
      b.addEventListener("click", function () {
        S.confidence[b.dataset.conf] = b.dataset.val; RU.save(); renderCourses();
      });
    });
    document.getElementById("next").addEventListener("click", function () {
      var touched = RU.touchedSubjects();
      var missing = touched.filter(function (n) {
        var subj = RU.byName(n);
        var completed = subj && subj.courses.some(function (c) { return S.courses[c] === "completed"; });
        return completed && !S.confidence[n];
      });
      if (missing.length) {
        document.getElementById("err").textContent =
          "How solid is " + missing[0] + "? Pick one" + (missing.length > 1 ? " (and " + (missing.length - 1) + " more)." : ".");
        return;
      }
      /* The funnel is now complete enough to compute everything. This is where
         done is earned — moving `when` earlier must not open #reveal deep links. */
      S.done = true; RU.save();
      var completedCount = RU.SUBJECTS.filter(function (x) {
        return x.courses.some(function (c) { return S.courses[c] === "completed"; });
      }).length;
      RU.track("courses_set", { touched: touched.length, completed: completedCount, subjects_total: 8 });
      RU.track("confidence_set", { answered: Object.keys(S.confidence).length, of: completedCount });
      renderBuilding();
    });
  }

    var h = '<div class="panel">' + stepArt("when") + affirmStrip("when") + '<h1>When is your MCAT?</h1>' +

    view.innerHTML = h;
    repaintArt();
    var box = document.getElementById("opts");
    RU.WHEN_OPTIONS.forEach(function (o) {
      var b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.setAttribute("aria-pressed", String(S.timeframe === o.v));
      b.innerHTML = esc(o.l) + '<span class="tick">✓</span>';
      b.addEventListener("click", function () {

      });
      box.appendChild(b);
    });
    var ex = document.getElementById("exact"), inp = document.getElementById("dateIn");
    ex.hidden = S.timeframe !== "exact";
    var today = new Date().toISOString().slice(0, 10);
    inp.min = today;
    if (S.testDate) inp.value = S.testDate;
    inp.addEventListener("change", function () {
      var v = inp.value || null;
      // A date in the past is not a test date. Reject rather than store it.
      if (v && v < today) { S.testDate = null; inp.value = ""; document.getElementById("err").textContent = "That date has already passed. Pick your real test date."; }
      else { S.testDate = v; document.getElementById("err").textContent = ""; }
      RU.save();
    });

    document.getElementById("next").addEventListener("click", function () {
      if (!S.timeframe) { document.getElementById("err").textContent = "Pick one so the plan can be paced."; return; }
      if (S.timeframe === "exact" && !S.testDate) { document.getElementById("err").textContent = "Add your test date."; return; }
      if (S.timeframe === "exact" && S.testDate < today) { document.getElementById("err").textContent = "That date has already passed. Pick your real test date."; return; }
      RU.save();
      var d = RU.daysUntilTest();
      RU.track("when_set", { timeframe: S.timeframe,
        days_bucket: d === null ? "none" : d <= 60 ? "0-60" : d <= 120 ? "61-120" : d <= 240 ? "121-240" : "241+" });
      go(nextOf("when"));

  /* Between the last answer and the reveal: the plan is visibly assembled.
     The pause is deliberate (labor illusion — Flo/Noom both do this): work the
     user can see raises the value of what comes next. Every line names a real

  function renderBuilding() {
    var lines = [
      "Reading your coursework&hellip;",

    ];

      box.innerHTML += '<div class="bstep-line" style="display:flex; gap:9px; align-items:baseline; padding:7px 0; font-size:15.5px; color:var(--muted)">' +
        '<span class="bstep-check" style="color:var(--violet); font-weight:900">&check;</span><span>' + lines[i] + '</span></div>';

  /* ----------------------------------------------------------------- reveal */

  function renderReveal() {
    var rows = RU.rows(), d = RU.daysUntilTest(), goal = RU.suggestedGoal();

      { key: "Chem/Phys", label: "Chemical & Physical Foundations" },
      { key: "Bio/Biochem", label: "Biological & Biochemical Foundations" },

      '<div class="rev-stats">' +

        '<div class="rev-stat"><div class="n">8</div><div class="l">subjects mapped</div></div>' +
        '<div class="rev-stat"><div class="n">' + RU.paceMinutes(goal) + ' min</div><div class="l">a day suggested</div></div>' +
      '</div></div>';

    cats.forEach(function (c) {
      var mine = rows.filter(function (r) { return r.category === c.key; });
      if (!mine.length) return;
      h += '<div class="catgroup"><div class="catname">' + esc(c.label) + '</div>';
      mine.forEach(function (r) {
        var w = { preview: 12, easy: 30, medium: 52, hard: 75, mcat: 100 }[r.tier];
        h += '<div class="lvl-row"><span class="lvl-name">' + esc(r.name) + '</span>' +
             '<span class="pill p-' + r.tier + '">' + esc(r.label) + '</span>' +
             '<span class="lvl-bar"><i style="width:' + w + '%"></i></span></div>';
      });
      h += '</div>';
    });

    if (previews && (S.feeling === "behind" || S.feeling === "unsure")) {
      h = h.replace('<div class="catgroup">',
        '<div class="notice" style="margin:4px 0 18px"><b>Before you scroll:</b> ' +
        previews + ' of these are in Preview, and that is not a bad result. It is the ' +
        'reason RampUp exists - those get taught before they get tested.</div><div class="catgroup">');
    }
    if (previews) {
      h += '<div class="notice" style="margin-top:20px"><b>' + previews + ' subject' +
        (previews === 1 ? " is" : "s are") + ' in Preview.</b> That is not a gap to be embarrassed about — it is the ' +
        'part RampUp is actually built for. Those get the concept lesson first, and gentler questions, until the coursework catches up.</div>';
    }

    /* One REAL question at their computed tier in a subject they completed:
       the reveal stops describing the product and briefly IS the product
       (plan 2.1). True data only; a miss is framed as the mechanism working. */
    h += (function () {
      var pick = null;
      for (var ri = 0; ri < rows.length; ri++) {
        var r0 = rows[ri];
        var subj = RU.byName(r0.name);
        var completed = subj && subj.courses.some(function (c) { return S.courses[c] === "completed"; });
        if (!completed || r0.preview) continue;
        var k = r0.name + "|" + r0.tier;
        if (window.RU_SAMPLES && window.RU_SAMPLES[k]) { pick = window.RU_SAMPLES[k]; break; }
      }
      if (!pick) {
        // No Completed subject (freshmen, all-"taking" answers): fall back to
        // ANY tier we have a sample for, easiest first, so the reveal always
        // demonstrates instead of only describing (conversion team 2026-08-14).
        var tiers = ["easy", "medium", "hard", "mcat"];
        outer:
        for (var ti = 0; ti < tiers.length && !pick; ti++)
          for (var rj = 0; rj < rows.length; rj++) {
            var k2 = rows[rj].name + "|" + tiers[ti];
            if (window.RU_SAMPLES && window.RU_SAMPLES[k2]) { pick = window.RU_SAMPLES[k2]; break outer; }
          }
      }
      if (!pick) return "";
      window._sq = pick;
      var ch = pick.choices.map(function (c, i) {
        return '<button type="button" class="sq-choice" data-sq="' + i + '">' + esc(c) + '</button>';
      }).join("");

        ' ' + esc(pick.subject) + ' question, the first your plan would serve</div>' +

        '<audio controls preload="none" style="width:100%" src="/assets/walkthrough-sample.m4a"></audio></div>';
    })();

    /* Their own deadline, done as arithmetic. True numbers only: days they
       gave us, the pace we just computed. Urgency that comes from the user's
       own situation is legitimate; urgency invented by us would not be. */
    var mins = RU.paceMinutes(goal);
    if (d !== null && d > 0) {
      var hours = Math.round(d * mins / 60);

      '<h1 style="font-size:21px">Your first day</h1>' +
      '<p class="sub">' + RU.paceMinutes(goal) + ' minutes, about ' + goal + ' questions. Every block says why it is there.</p>' +
      '<ul class="planlist">';
    var plan = RU.planPreview();
    plan.blocks.forEach(function (b, i) {
      h += '<li class="planblock"><span class="pb-n pb-' + b.kind + '">' + (i + 1) + '</span>' +
           '<span><span class="pb-t">' + esc(b.title) + '</span>' +

    h += '</ul>';
    /* Risk reversal belongs BEFORE the price (plan §2.3-2.5). The copy here

    SHOWN.forEach(function (p, i) {
      var sel = i === 0;
      h += '<button class="opt planopt" type="button" data-plan="' + p.key + '" aria-pressed="' + sel + '">' +
        '<span class="pl-label">' + esc(p.label) + (p.best ? ' <span class="pl-flag">' + esc(p.save) + '</span>' : '') + '</span>' +
        '<span class="pl-price">' + esc(p.perMonthNum) + '<i>/mo</i></span>' +
        '<span class="pl-per">' + esc(p.billed) + '</span>' +
        '</button>';
    });
    h += '</div>';

    h += '<ul class="incl" style="margin-top:20px">' +
      '<li>1,103 practice questions, 277 at MCAT level</li>' +
      '<li>Your ' + esc(String(goal)) + '-question daily plan, rebuilt every day</li>' +
      '<li>Concept lessons before anything new to you</li>' +
      '<li>132 narrated walkthroughs</li>' +
      '<li>7 timed exams in a real-test-style interface, two of them full 230-question sittings</li>' +
      '<li>Rampy on every question</li>' +
      '</ul>';

    var FEEL_LINE = {
      behind:    "You are not behind, you are early - which is the only time this kind of ramp works.",
      unsure:    "You know exactly where you stand now. That was the hard part.",
      steady:    "You have the plan. This is the part where it runs every day.",
      confident: "Good. RampUp pushes the ceiling up per subject as you clear it."
    };
    if (S.feeling && FEEL_LINE[S.feeling]) {
      h += '<div class="notice" style="margin-top:20px;border-color:#d9d2f0;background:#faf8ff;color:#3b3357">' +
        esc(FEEL_LINE[S.feeling]) + '</div>';
    }
    if (live) {
      h += '<p class="tiny" style="text-align:center;margin:14px 0 0">' +
        'Day 1: everything unlocks. Day 7: first charge &mdash; cancel in one click before then and you pay nothing.</p>';
    }
    h += '<p class="reassure">Full access on both &middot; Cancel any time &middot; No account needed</p>';

    if (live) {
      h += '<div class="actions" style="margin-top:14px"><button class="btn btn-primary btn-lg btn-block" id="buy" type="button">Start my 7 days free <span class="arw">&rarr;</span></button></div>' +
        '<p class="tiny" id="renew" style="text-align:center;margin:12px 0 0"></p>';
    } else {
      /* Honest unavailable state. No fake checkout, no fake trial, and not a
         dead end: the access-code path below is real and works today. */
      h += '<div class="notice" style="margin-top:22px">' +
        '<b>Card checkout is not open yet.</b> RampUp\'s subscription billing is being ' +
        'switched on, and we will not show a payment button that cannot complete. ' +
        'Your levels and plan are saved on this device and will be exactly here when it opens.</div>' +
        '<div class="actions"><button class="btn btn-primary btn-lg btn-block" id="code" type="button">I have an access code</button></div>' +
        '<p class="tiny" style="text-align:center;margin:12px 0 0">' +
        'Got an early-access code? It unlocks everything immediately, on this device.</p>';
    }

    h += '<p class="tiny" style="text-align:center;margin:18px 0 0">' +
      '<a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a> · ' +
      '<a href="mailto:rampupmcat@gmail.com">Support</a></p></div>';

    view.innerHTML = h;
    repaintArt();
    RU.track("paywall_view", { billingLive: live });

    var chosen = SHOWN[0].key;
    function paint() {
      view.querySelectorAll("[data-plan]").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.plan === chosen));
      });
      var r = document.getElementById("renew");
      if (r) r.textContent = RUBilling.planByKey(chosen).renewLine;
    }
    view.querySelectorAll("[data-plan]").forEach(function (b) {
      b.addEventListener("click", function () {
        chosen = b.dataset.plan; RU.track("plan_selected", { plan: chosen }); paint();
      });
    });
    paint();

    var buy = document.getElementById("buy");
    if (buy) buy.addEventListener("click", function () {
      if (!RUBilling.startCheckout(chosen)) {
        buy.disabled = true;
        buy.textContent = "Checkout unavailable — please try later";
      }
    });
    var code = document.getElementById("code");
    if (code) code.addEventListener("click", function () {
      RU.track("code_path", {});
      location.href = "/app/?redeem=1";
    });
  }

  /* ------------------------------------------------------------------ route */

  var RENDER = { name: renderName, grade: renderGrade, when: renderWhen, target: renderTarget, feeling: renderFeeling,
                 courses: renderCourses, reveal: renderReveal, commit: renderCommit, plan: renderPlan };

  var _prevStepIdx = -1;
  function route() {
    var step = current();
    if (step === "confidence") { go("courses", true); step = "courses"; }   // legacy hash
    // Cannot land on the reveal or paywall without having actually answered.
    if ((step === "reveal" || step === "commit" || step === "plan") && !S.done) { go("name", true); step = "name"; }
    chrome(step);
    var idx = STEPS.indexOf(step);
    var direction = (_prevStepIdx === -1 || idx >= _prevStepIdx) ? 1 : -1;   // back slides the other way
    _prevStepIdx = idx;
    var render = function () { (RENDER[step] || renderName)(); };
    if (window.RUMotion) RUMotion.panelTransition(view, render, direction);
    else render();
    window.scrollTo(0, 0);
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest(".guarantee a");
    if (a) RU.track("guarantee_expanded", { step: current() });
  });
  backBtn.addEventListener("click", function () {
    var p = prevOf(current());
    if (p) location.hash = p; else history.back();
  });
  window.addEventListener("hashchange", route);
  if (!location.hash) go(S.done ? "reveal" : "name", true);
  route();
})();
</script>
</body>
</html>
